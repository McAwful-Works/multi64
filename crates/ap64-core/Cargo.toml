[package]
name = "ap64-core"
description = "Detect an Archipelago N64 seed and splice the M64P cart agent into it"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
toml = "1.1"
serde_json = "1"
# Reads an installed apworld's archipelago.json (src/installed.rs). Deflate only, in pure
# Rust, held at 4.2 like ap64-connector's: 4.6 needs Rust 1.82, past the workspace's 1.80.
zip = { version = "~4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
