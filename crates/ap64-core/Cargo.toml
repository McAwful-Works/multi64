[package]
name = "ap64-core"
description = "Detect an Archipelago N64 seed and splice the M64P cart agent into it"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
toml = "1.1"
serde_json = "1"
# Reads an installed apworld's archipelago.json (src/installed.rs). Deflate only, in pure
# Rust, at the same version as ap64-connector's.
zip = { version = "~9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# check_output: whether the output is the seed by file identity (volume serial and file index on
# Windows, device and inode elsewhere), so a hard link is caught. Already in the lock via walkdir.
same-file = "1"
