# Bomberman 64: The Second Attack! (US). Addresses from the Bomberhackers/bm64tsa decomp's
# symbols: boot_code is ROM 0x1000 at 0x80000400, uncompressed in the retail ROM and in a
# seed, and the world's ROM adjuster leaves every byte of it alone.
# Blobs: crates/ap64-core/agent/build.sh bmtsa (see BUILD_REV).

id = "bmtsa"
name = "Bomberman 64: The Second Attack!"
release = "US"
game_code = "NBVE"
version = 0
cic = "6102"
randomizer = "Happyhappyism and SavageWizzrobe's Bomberman The Second Attack world"
connector = "generic"     # Archipelago's BizHawk Client

[measured]
world = "bomberman_tsa.apworld"
version = "1.0.2"

[agent]
image = "agent.bin"
rom = 0x1000000         # past the retail 16 MB, which the world keeps
vram = 0x80480000       # Expansion Pak, which the game never touches
min_ram = 0x800000      # the stub skips the agent without an Expansion Pak

# The world's seed is not finished until its ROM adjuster has run: BizHawk Client does it
# the first time it connects, unpacking the ROM with the world's pack.exe, rewriting the
# door data in every stage's map, replacing three power-up files and the chosen models,
# repacking, and setting this flag (and one at 0x99FDA). On a console the client reads the
# flag off the cart and offers to adjust a file on the PC, which is too late for the ROM
# already running. Worse, adjusting a ROM AP64 has patched cuts it back to 16 MB, taking the
# agent with it, and leaves a header checksum that no longer matches, so it will not boot.
# So only an adjusted seed is accepted.
[[require]]
kind = "word"
label = "Seed adjusted by the world's ROM adjuster"
at = 0xF8000            # the adjuster's flag byte, then three zeros
equals = 0x01000000
hint = "This seed has not been through the world's ROM adjuster, which sets up its doors, power-ups and models. AP64 cannot run it yet. Open this .z64 once in BizHawk with BizHawk Client connected, choose this same file in the window the client opens, then patch the adjusted file here. Never let the client adjust a ROM AP64 has already patched: that breaks it."

[[require]]
kind = "word"
label = "Frame hook site"
at = 0x2054            # systemmain: jal CallProcess (0x800077B4) at 0x80001454
equals = 0x0C001DED
hint = "The randomizer changed the game loop, so the hook has nowhere to go."

[[require]]
kind = "sha1"
label = "Space for the hook stub"
at = 0xC87C             # bmLoadBitmapTile, 0x8000BC7C, which nothing calls
len = 0x338
sha1 = "ccbf565c6f50de654d1bf3cda188232017119c39"
hint = "Something now occupies the dead code the stub goes in. Re-run the dead-space measurement before moving it."

[[require]]
kind = "sha1"
label = "Function the hook calls first"
at = 0x83B4             # CallProcess, 0x800077B4
len = 0x1B8
sha1 = "498b98131376ae051149c3b80e2238ff8291bb38"
hint = "The randomizer changed the code the hook passes each frame through to."

[[require]]
kind = "sha1"
label = "ROM copy routine"
at = 0x1298             # dmaRead, 0x80000698, in the resident boot code
len = 0xD0
sha1 = "e6eb8e61d66ae439377de783f2dd520048f72fb6"
hint = "The randomizer changed the routine the stub loads the agent with."

# Archipelago's patch NOPs IPL3's two checksum-mismatch branches so an unfixed checksum
# still boots, exactly as the CV64 world does. Put them back; the output gets a correct
# checksum instead.
[[write]]
kind = "restore"
label = "Boot checksum check (1 of 2)"
at = 0x66C
bytes = "14e80006"
accept = ["00000000"]

[[write]]
kind = "restore"
label = "Boot checksum check (2 of 2)"
at = 0x678
bytes = "16080003"
accept = ["00000000"]

[[write]]
kind = "blob"
label = "Hook stub"
at = 0xC87C
file = "stub.bin"
max_len = 0x338

# The stub's lui/addiu of AGENT_ROM (stub + 0x6C). It keeps agent.rom when the seed
# leaves room there; when the seed's data reaches it, the agent goes past the data and
# this tells the stub where.
[[write]]
kind = "imm"
label = "Where the agent is, for the stub"
hi = 0xC8E8
lo = 0xC8EC
value = "agent_rom"

[[write]]
kind = "jal"
label = "Frame hook"
at = 0x2054
target = 0x8000BC7C
