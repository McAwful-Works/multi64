# Castlevania 64 (US 1.0). No decomp: everything is placed by address.
# Blobs: tools/cv64/build.sh 0x80480000 0xC00000 0x800000 (see BUILD_REV).

id = "cv64"
name = "Castlevania 64"
release = "US 1.0"
game_code = "ND3E"
version = 0
cic = "6102"
randomizer = "Archipelago's Castlevania 64 world"
connector = "generic"     # Archipelago's BizHawk Client

[agent]
image = "agent.bin"
rom = 0xC00000          # past the 12 MiB retail image
vram = 0x80480000       # Expansion Pak, measured unused during play
min_ram = 0x800000      # the stub skips the agent without an Expansion Pak

[[require]]
kind = "word"
label = "Frame hook site"
at = 0x1601C            # game_loop: jal 0x80002334 (the root object tree)
equals = 0x0C0008CD
hint = "The randomizer changed game_loop, so the hook has nowhere to go."

[[require]]
kind = "sha1"
label = "Space for the hook stub"
at = 0x1A800            # processMeter (debug.c, 0x80019C00), unused in the retail game
len = 0x650
sha1 = "6a55b77b60d114845beb945d54fc04607fa1ffa5"
hint = "Archipelago writes shop text here when shopsanity is on. Generate with shopsanity off."

[[require]]
kind = "sha1"
label = "Function the hook calls first"
at = 0x2F34             # 0x80002334
len = 0x80
sha1 = "0527615088f815c03100b1f752d2fc64a46ef923"
hint = "The randomizer changed the code the hook passes each frame through to."

[[require]]
kind = "sha1"
label = "ROM copy routine"
at = 0x183EC            # DMA_ROMCopy, 0x800177EC
len = 0x80
sha1 = "45ef057388bab6206bf6978b276ca93a84620079"
hint = "The randomizer changed the routine the stub loads the agent with."

# Archipelago's patch NOPs IPL3's two checksum-mismatch branches so an unfixed checksum
# still boots. Put them back; the output gets a correct checksum instead.
[[write]]
kind = "restore"
label = "Boot checksum check (1 of 2)"
at = 0x66C
bytes = "14e80006"
accept = ["00000000"]

[[write]]
kind = "restore"
label = "Boot checksum check (2 of 2)"
at = 0x678
bytes = "16080003"
accept = ["00000000"]

[[write]]
kind = "blob"
label = "Hook stub"
at = 0x1A800
file = "stub.bin"
max_len = 0x650

[[write]]
kind = "jal"
label = "Frame hook"
at = 0x1601C
target = 0x80019C00
