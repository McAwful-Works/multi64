# Donkey Kong 64 (US), as the DK64 randomizer builds it: dk64.apworld v1.5.8, ROM made on
# dk64randomizer.com. Names from Rainchus/Donkey-Kong-64-Recompiled DK64Syms/dump.toml.
# Every pinned range was checked byte-for-byte between the seed ROM and a live RAM dump.
# Two mappings: boot segment vram = rom + 0x7FFFF400; main code (shipped uncompressed by
# the randomizer, past 32 MB) vram = rom + 0x7E5C1540 in v1.5.8. Measurements: #309.
# Blobs: crates/ap64-core/agent/build.sh dk64 (see BUILD_REV).
#
# The main code's ROM offset moves whenever anything the randomizer puts before it changes
# size, so it is found in each seed (the `main` find below) and every main-code place is
# given by its RAM address through it, as main@0x8.... The boot segment does not move.
#
# The heap's top is where the randomizer's own code starts, which moves too, so it is read
# rather than pinned: any value that keeps that code clear of the agent is accepted, and the
# write gives the game the same heap it was measured with wherever the top was.
#
# Measured against dk64.apworld v1.5.8. What this cannot absorb: a release that patches the
# functions pinned here. That still fails these checks and needs measuring again (#309 has
# how).

id = "dk64"
name = "Donkey Kong 64"
release = "US"
game_code = "NDOE"
version = 0
cic = "6105"
randomizer = "the DK64 randomizer's Archipelago world"
connector = "dk64"        # native: AP64 answers the DK64 Client as RetroArch (ap64-connector dk64)

[agent]
image = "agent.bin"
rom = 0x3402000         # past the 52 MB image the randomizer produces (ends 0x34013A8)
vram = 0x805BA000       # above the heap top the write below sets
min_ram = 0x800000      # DK64 does not boot without an Expansion Pak anyway

# The copy routine the stub loads the agent with, which the randomizer leaves alone, is
# what locates the main code: the one place in the seed holding it is where the main
# code's 0x805FB750 is. 0x203A210 in v1.5.8, among 313 places that open with the same
# instruction.
[[find]]
name = "main"
label = "ROM copy routine"
word = 0x27BDFFD0       # addiu sp, sp, -0x30
len = 0x94
sha1 = "f24e90c61c47065d95239f95d6001b92ef37200f"
vram = 0x805FB750       # func_global_asm_805FB750 -- (romOffset, size, dest), base at 0x8000DDCC
hint = "The randomizer changed the routine the stub loads the agent with, which is also what locates the game's main code in the seed."

[[require]]
kind = "word"
label = "Frame hook site"
at = "main@0x805FC4CC"  # in the frame loop: jal func_global_asm_8070DD44
equals = 0x0C1C3751
hint = "The randomizer changed DK64's frame loop. It already hooks the same loop at 0x805FC3FC (that is expected); this pin is the call five instructions after it."

# The heap's top, in the heap setup (func_global_asm_80610350, 0x80610350..0x806109EC):
# lui t5 / ori t5 build it, and the fixed buffers are carved downward from it before the
# heap. Retail has 0x805FAE00, where the randomizer's code ends; the randomizer lowers it to
# make room for that code, to 0x805C1040 in v1.5.8. The write below always makes it
# 0x805B9040, so what lies under the top is exactly what was measured, and the top may be
# anything from the agent's end (AGENT_BSS_END) up to the end of the randomizer's code.
[[require]]
kind = "imm"
label = "Heap top"
hi = "main@0x80610510"
lo = "main@0x80610518"
hi_word = 0x3C0D0000    # lui t5, ...
lo_word = 0x35AD0000    # ori t5, t5, ...
min = 0x805C0520        # the agent's end: below it, the randomizer's code would overlap it
max = 0x805FAE00        # retail's top, where the randomizer's code ends
hint = "The randomizer's own code now starts below the end of the agent, so the two would overlap. The agent needs a lower address, and the carve-out measuring again."

# The rest of the heap setup, so a change to the buffers carved under the top still refuses.
# Pinned in pieces around the heap top and around 0x80610948, where the randomizer jumps
# into its own code: that jump's target moves with the randomizer's code.
[[require]]
kind = "sha1"
label = "Heap setup (before the top)"
at = "main@0x80610350"
len = 0x1C0
sha1 = "a1e5033d7f803f8b0c601b50a85ebd90b90fa4e3"
hint = "The randomizer changed the heap setup, which decides how much heap is left under the agent."

[[require]]
kind = "word"
label = "Heap setup (between the top's two halves)"
at = "main@0x80610514"
equals = 0xAC264474
hint = "The randomizer changed the heap setup, which decides how much heap is left under the agent."

[[require]]
kind = "sha1"
label = "Heap setup (after the top)"
at = "main@0x8061051C"
len = 0x42C
sha1 = "08afe39f232bb117359cce815c99bbb91bcadded"
hint = "The randomizer changed the heap setup, which decides how much heap is left under the agent."

[[require]]
kind = "sha1"
label = "Heap setup (after the randomizer's jump)"
at = "main@0x80610950"
len = 0x9C
sha1 = "1dd429dae82c36e29f28025d3174471f324ff27c"
hint = "The randomizer changed the heap setup, which decides how much heap is left under the agent."

[[require]]
kind = "sha1"
label = "Space for the hook stub"
at = 0xDD80             # 0x8000D180: __osRepairPackId, __osCheckPackId, __osGetId
len = 0x660
sha1 = "7c5fc61a6189fd92245dad3896b0efbf3b0f2cf1"
hint = "Something now occupies the dead Controller Pak code the stub goes in. Re-run the dead-space count before moving it."

[[require]]
kind = "sha1"
label = "Function the hook calls first"
at = "main@0x8070DD44"  # func_global_asm_8070DD44
len = 0x98
sha1 = "305d22d293fa8e18a92e49a99731e2d18e5b0d76"
hint = "The randomizer changed the code the hook passes each frame through to."

[[require]]
kind = "sha1"
label = "PI DMA through the manager"
at = 0x7B10             # osPiStartDma, 0x80006F10, called by the copy routine
len = 0x10C
sha1 = "019726997b80f8b221de15d69eb71a43e42467ed"
hint = "libultra's osPiStartDma changed under the copy routine."

[[require]]
kind = "sha1"
label = "I-cache invalidate"
at = 0x5E60             # osInvalICache, 0x80005260
len = 0x80
sha1 = "7a08747cbcfbb94a18ecc13357d1762825f73f8b"
hint = "The copy routine handles the data cache only, so the stub must invalidate I-cache itself or run stale lines. Emulators do not model this; a console does."

# No IPL3 restore: the randomizer leaves 0x40..0x1000 byte-identical to retail (CIC-6105).
# The stub lands inside the checksummed first megabyte, so the patcher recomputes the CRC.

[[write]]
kind = "imm"
label = "Heap top lowered for the agent"
hi = "main@0x80610510"
lo = "main@0x80610518"
value = 0x805B9040      # 32 KB under v1.5.8's; the heap's low point measured 739 KB with this

[[write]]
kind = "blob"
label = "Hook stub"
at = 0xDD80
file = "stub.bin"
max_len = 0x660

# The stub's lui/addiu of AGENT_ROM (stub + 0x64). It keeps agent.rom when the seed
# leaves room there; when the seed's data reaches it, the agent goes past the data and
# this tells the stub where.
[[write]]
kind = "imm"
label = "Where the agent is, for the stub"
hi = 0xDDE4
lo = 0xDDE8
value = "agent_rom"

[[write]]
kind = "jal"
label = "Frame hook"
at = "main@0x805FC4CC"
target = 0x8000D180
