[package]
name = "xfer64"
version = "0.1.0"
description = "Xfer64 — dual-pane flash-cart SD ↔ Windows (Multi64; SC64 USB serial)"
authors = ["Multi64 contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "xfer64_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
multi64-sc64-sd = { path = "../../multi64-sc64-sd", features = ["ed64"] }
multi64-ed64-link = { path = "../../multi64-ed64-link" }
serialport = "4"
ureq = { version = "3", default-features = false }
