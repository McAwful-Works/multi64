<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xfer64 — developer log</title>
    <style>
      /* Layout fallback if explorer.css fails to load; colors come from the theme in explorer.css. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, sans-serif;
      }
    </style>
    <link rel="stylesheet" href="./explorer.css" />
    <script src="./appearance.js"></script>
  </head>
  <body class="explorer-root dev-shell-root">
    <header class="explorer-appbar dev-shell-appbar">
      <div class="app-brand">
        <img class="app-brand-mark" src="./brand-mark.svg" alt="" width="28" height="28" />
        <div class="app-brand-text">
          <h1 class="app-title">Xfer64</h1>
          <span class="app-productline">Cart SD over USB</span>
        </div>
      </div>
      <div class="dev-shell-intro">
        <h2 class="dev-shell-heading">Developer log</h2>
        <p class="dev-shell-desc">
          N64 flash cart SD / USB serial activity from the Xfer64 backend. For a full shell, use an external terminal.
        </p>
      </div>
      <div class="dev-shell-actions">
        <button type="button" class="btn" id="dev-shell-refresh" title="Reload buffer from app">Refresh</button>
        <button type="button" class="btn" id="dev-shell-copy" title="Copy visible log text to the clipboard">Copy</button>
        <button type="button" class="btn" id="dev-shell-clear" title="Clear buffer">Clear</button>
        <button type="button" class="btn primary" id="dev-shell-close" title="Hide this window">Close window</button>
      </div>
    </header>
    <main class="dev-shell-main">
      <pre id="dev-shell-log" class="dev-shell-log" aria-live="polite"></pre>
    </main>
    <script defer src="./dev-shell.js"></script>
  </body>
</html>
