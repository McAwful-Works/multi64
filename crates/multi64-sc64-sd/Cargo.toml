[package]
name = "multi64-sc64-sd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Flash-cart SD over USB serial: SC64 SD_READ/MEMORY_READ + optional EverDrive RomRead linear mapping; FAT/exFAT"

[dependencies]
multi64-sc64-link = { path = "../sc64-link" }
multi64-ed64-link = { path = "../multi64-ed64-link", optional = true }
serialport = "4"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
hadris-fat = { version = "1.1", default-features = false, features = ["std", "read", "write", "lfn", "exfat"] }
# Same git pin as hadris-fat (via [patch.crates-io]) for `U16`/`U32`/`U64` in exFAT raw entries.
hadris-common = { git = "https://github.com/hxyulin/hadris.git", rev = "46bcf3356f30cd2fda8bcc79fe74183a0274a6a3", package = "hadris-common" }
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }

[features]
default = []
ed64 = ["dep:multi64-ed64-link"]

[dev-dependencies]
sha2 = "0.11"
