[package]
name = "ed64-echo-test"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "E2E: send L3 bytes to multi64_test.z64 (RAW_ECHO) over EverDrive L2 (requires ed64-l2)"

[[bin]]
name = "ed64-echo-test"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
multi64-ed64-l2 = { path = "../ed64-l2" }
