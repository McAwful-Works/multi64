[package]
name = "multi64-ed64pro-l2"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "L3 byte stream over the EverDrive-64 PRO's FIFO and USB link (experimental; never run against a cart — see docs/spec/l3-over-everdrive-pro.md)"
readme = "README.md"

[lib]
name = "multi64_ed64pro_l2"
path = "src/lib.rs"

[dependencies]
multi64-ed64pro-link = { path = "../ed64pro-link" }
serialport = "4"
tracing = "0.1"

[dev-dependencies]
multi64-ed64pro-link = { path = "../ed64pro-link", features = ["fake"] }
