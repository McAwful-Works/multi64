[package]
name = "multi64"
version = "0.1.0"
description = "Multi64 desktop shell — manages multi64d on Windows"
authors = ["Multi64 contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["xfer64"]
# Bundle Xfer64's installer, and show its card and tray item.
#
# Off builds the standalone Multi64: no Xfer64 installer inside the package, no card, no tray
# item, and none of the registry and path searching that finds an installed copy. Package that
# build with tauri.standalone.conf.json, which drops the Xfer64 resources the default config
# declares -- a declared resource that is missing is a hard error in tauri-build, so the two go
# together.
xfer64 = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
multi64-cart-probe = { path = "../../cart-probe" }
dirs = "7"
auto-launch = "0.6"
parking_lot = "0.12"
ureq = { version = "3", features = ["json"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Already in the tree through winreg; only the job-object API is added (#146).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Tests check the saved cart names against the daemon's own `--cart` values.
multi64d = { path = "../../multi64d" }

