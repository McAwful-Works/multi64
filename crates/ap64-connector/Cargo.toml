[package]
name = "ap64-connector"
description = "Run an Archipelago connector against a cart: a forked script, or a native one"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ap64-cart = { path = "../ap64-cart" }
ap64-core = { path = "../ap64-core" }
# `vendored` builds Lua from source: nothing to install on Windows.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
base64 = "0.23"
# Only for SO_LINGER: ending a session has to reset the connection, not close it
# politely -- see `Client::close`. std has no stable way to ask for that.
socket2 = "0.6"
sha1 = "0.11"
# Reads and rewrites an installed apworld to apply a client fix (src/dk64.rs, src/bt.rs).
# Deflate only, in pure Rust.
zip = { version = "~8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
