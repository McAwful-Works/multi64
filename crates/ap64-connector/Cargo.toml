[package]
name = "ap64-connector"
description = "Run a forked Archipelago connector script against a cart"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ap64-cart = { path = "../ap64-cart" }
ap64-core = { path = "../ap64-core" }
# `vendored` builds Lua from source: nothing to install on Windows.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
base64 = "0.22"
sha1 = "0.11"
