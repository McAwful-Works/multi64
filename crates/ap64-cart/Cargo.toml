[package]
name = "ap64-cart"
description = "Read and write a console's RDRAM through the M64P cart agent, via multi64d"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
multi64-l3 = { path = "../l3" }
# Synchronous WebSocket, no TLS: multi64d binds loopback and speaks ws://.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
