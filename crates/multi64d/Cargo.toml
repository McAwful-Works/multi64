[package]
name = "multi64d"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "multi64 reference daemon: WebSocket bridge to L3 byte stream (SummerCart64 L2 backend)"

[lib]
name = "multi64d"
path = "src/lib.rs"

[[bin]]
name = "multi64d"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
futures-util = "0.3"
multi64-sc64-l2 = { path = "../sc64-l2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
