[package]
name = "ed64pro-l3-framing-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "E2E: full L3 frames (M64B wire) over the EverDrive-64 PRO link vs. multi64_test.z64 RAW_ECHO (experimental; never run against a cart)"

[[bin]]
name = "ed64pro-l3-framing-e2e"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
multi64-l3 = { path = "../l3" }
multi64-ed64pro-l2 = { path = "../ed64pro-l2" }
multi64-ed64pro-link = { path = "../ed64pro-link" }
