# Builds the Windows installers when `main` advances (typically after a PR merge). Each app has
# its own: Multi64, Xfer64 and AP64 are installed separately, and none carries another inside it.
# Artifacts, one per app, are attached to the workflow run.
# Run manually from Actions: choose a branch, or set `git_ref` to a specific ref.

name: Windows apps (main)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to checkout (optional). Leave empty to use the branch SHA you select when clicking Run workflow."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: main-windows-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installers:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && (inputs.git_ref != '' && inputs.git_ref || github.sha)) || '' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            crates/multi64/package-lock.json
            crates/xfer64/package-lock.json
            crates/ap64/package-lock.json

      # multi64d ships inside Multi64 (a declared bundle resource), so it is built first.
      - name: Build multi64d (bundled into Multi64)
        run: cargo build -p multi64d --release

      - name: npm ci + tauri build (Multi64)
        working-directory: crates/multi64
        run: |
          npm ci
          npm run build

      - name: npm ci + tauri build (Xfer64)
        working-directory: crates/xfer64
        run: |
          npm ci
          npm run build

      - name: npm ci + tauri build (AP64)
        working-directory: crates/ap64
        run: |
          npm ci
          npm run build

      # Tauri names each installer after its productName, so the three never collide.
      - name: Upload Multi64
        uses: actions/upload-artifact@v7
        with:
          name: multi64-windows-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/release/multi64.exe
            target/release/bundle/nsis/Multi64_*-setup.exe
            target/release/bundle/msi/Multi64_*.msi
          if-no-files-found: error

      - name: Upload Xfer64
        uses: actions/upload-artifact@v7
        with:
          name: xfer64-windows-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/release/xfer64.exe
            target/release/bundle/nsis/Xfer64_*-setup.exe
            target/release/bundle/msi/Xfer64_*.msi
          if-no-files-found: error

      - name: Upload AP64
        uses: actions/upload-artifact@v7
        with:
          name: ap64-windows-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/release/ap64-app.exe
            target/release/bundle/nsis/AP64_*-setup.exe
          if-no-files-found: error
